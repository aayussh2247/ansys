[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ansys"
version = "0.1.0"
description = "A starter ANSYS-style finite-difference simulation toolkit"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "ANSYS Project" }
]
dependencies = []

[project.scripts]
ansys = "ansys.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
